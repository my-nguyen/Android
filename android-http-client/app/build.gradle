apply plugin: 'com.android.application'

android {
    namespace "com.hmkcode.android"
    compileSdk 34
    // MainActivity uses Apache HttpClient, which was removed from the SDK in API 23.
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        applicationId "com.hmkcode.android"
        minSdk 16
        targetSdk 27
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
